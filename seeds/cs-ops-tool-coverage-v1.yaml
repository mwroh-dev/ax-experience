goal: |
  CS Ops Tool Coverage Expansion — atomic 레벨 함수형 도구 확장.
  3개 integration의 커버리지를 높이고 TF-IDF 기반 document scoring을 추가한다.

  1. Slack client 추출: pipeline.ts에 인라인된 Slack 호출을 src/lib/slack-client.ts로 분리하고
     chat.update, get_user_info를 추가한다.

  2. Notion client 확장: read_page(), update_page_status() 함수를 추가한다.

  3. OpenClaw 미사용 모드 연결: keep_summary 모드를 route=hold 케이스에서 실제로 호출한다.

  4. TF-IDF document scorer: src/lib/scorer.ts에 순수 TypeScript로 score_documents()를 구현한다.
     기존 keyword contains 검색의 결과를 re-rank하는 데 사용한다.

  모든 새 함수는 FlowResult<T> 패턴 필수. No classes. No new npm packages.

constraints:
  - "Working directory for git: <project-root>"
  - "All source files in: cs-ops-api/src/"
  - "TypeScript strict mode — npx tsc --noEmit must exit 0 (run from cs-ops-api/)"
  - "Jest v30 — cd cs-ops-api && npx jest --no-coverage"
  - "FlowResult<T> = {ok:true;value:T;trace:TraceEntry[]} | {ok:false;error:string;step:string;trace:TraceEntry[]}"
  - "No new npm packages — check cs-ops-api/package.json first"
  - "All existing 97 tests must continue to pass"
  - "Commit each AC separately with conventional commit format + git trailers"
  - "TraceEntry 타입은 src/types.ts에서 import하라"

  # AC1 — Slack client 추출 및 확장
  - "Create src/lib/slack-client.ts with: post_message(channel, text): Promise<FlowResult<{ts:string}>>"
  - "Add to slack-client.ts: post_review_block(channel, blocks, text): Promise<FlowResult<{ts:string}>>"
  - "Add to slack-client.ts: update_message(channel, ts, text): Promise<FlowResult<void>>"
  - "Add to slack-client.ts: get_user_info(user_id: string): Promise<FlowResult<{name:string;real_name:string}>>"
  - "All functions use SLACK_BOT_TOKEN env var; return ok:false with descriptive error if token not set"
  - "Refactor pipeline.ts to import from slack-client.ts instead of inlining WebClient calls"
  - "Create src/lib/slack-client.spec.ts with 4+ tests (mock WebClient)"

  # AC2 — Notion client 확장
  - "Add read_page(page_id: string): Promise<FlowResult<{title:string;properties:Record<string,unknown>}>> to notion-client.ts"
  - "Add update_page_status(page_id: string, status: string): Promise<FlowResult<void>> to notion-client.ts"
  - "Both functions: return ok:false (not throw) on API error"
  - "Add 3+ tests for new functions in a new src/lib/notion-client.spec.ts (mock @notionhq/client)"

  # AC3 — OpenClaw keep_summary 연결
  - "In pipeline.ts route=hold path: after routing decision, call call_cs_bot({mode:'keep_summary', ...}) to generate a hold summary"
  - "Store summary result in AutomationRunLog.final_answer when present (override only if not already set)"
  - "keep_summary call failure must not break the pipeline — catch and continue"
  - "Add hold_summary?: string to AutomationRunLog interface in types.ts"
  - "Add 2+ tests in pipeline.spec.ts for hold path with keep_summary"

  # AC4 — TF-IDF document scorer
  - "Create src/lib/scorer.ts with: score_documents(query: string, docs: NotionHit[]): ScoredHit[]"
  - "ScoredHit = NotionHit & { score: number } — exported from scorer.ts"
  - "TF-IDF implementation: tf = term_freq / doc_length, idf = log(N / df + 1), score = sum(tf * idf)"
  - "Tokenize by splitting on whitespace + removing punctuation + lowercasing"
  - "score_documents returns docs sorted by score descending, score=0 docs included"
  - "Use score_documents in retrieve_evidence() after search_faq/search_policies to re-rank results"
  - "Create src/lib/scorer.spec.ts with 4+ tests: higher-relevance doc scores higher, empty query, single doc, Korean text"

acceptance_criteria:
  - "src/lib/slack-client.ts exports post_message, post_review_block, update_message, get_user_info"
  - "pipeline.ts no longer imports WebClient directly — uses slack-client.ts functions"
  - "src/lib/slack-client.spec.ts has 4+ tests, all pass"
  - "read_page and update_page_status exported from src/lib/notion-client.ts"
  - "src/lib/notion-client.spec.ts has 3+ tests for new Notion functions, all pass"
  - "pipeline.ts route=hold calls call_cs_bot keep_summary mode"
  - "hold_summary field present in AutomationRunLog interface (src/types.ts)"
  - "src/lib/scorer.ts exports score_documents and ScoredHit"
  - "retrieve_evidence uses score_documents to re-rank NotionHit results"
  - "src/lib/scorer.spec.ts has 4+ tests, all pass"
  - "cd cs-ops-api && npx tsc --noEmit exits 0"
  - "cd cs-ops-api && npx jest --no-coverage: all tests pass (105+ total)"

ontology_schema:
  name: "ExpandedToolSuite"
  description: "CS Ops pipeline with atomic-level functional tools for Slack, Notion, OpenClaw, and TF-IDF scoring"
  fields:
    - name: "hold_summary"
      field_type: "string"
      description: "Keep-summary generated by OpenClaw when ticket is routed to hold"
    - name: "ScoredHit"
      field_type: "object"
      description: "NotionHit augmented with TF-IDF relevance score"

