name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install
          (cd cs-ops-core && npm install)
          (cd api && npm install)

      - name: Type check (notion)
        run: cd notion && npx tsc --noEmit

      - name: Run tests
        run: npx jest --no-coverage --passWithNoTests
